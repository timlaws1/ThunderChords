<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Setlists · ThunderChords</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#12171f">
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=Syne:600,700|DM+Sans:400,500,600|IBM+Plex+Mono:400,700" rel="stylesheet">

<link rel="stylesheet" href="/style.css">

<body>
<header class="bar">
  <a href="/" class="btn">Library</a>
  <h1>Setlists</h1>
  <button type="button" class="theme-btn" data-theme-toggle>Dark</button>
</header>
<main class="wrap">
  <div class="row"><input id="name" placeholder="New setlist name"><button id="make" class="primary" data-needs-net>Create</button></div>
  <p id="err" class="err"></p>
  <ul id="list" class="list"></ul>

</main>
<script type="module" src="/setlists.js"></script>
